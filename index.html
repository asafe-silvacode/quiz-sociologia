<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Sociologia</title>
  <link rel="shortcut icon" href="https://icons.iconarchive.com/icons/oxygen-icons.org/oxygen/256/Status-mail-task-icon.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="page">
    <div class="container">

      <div class="text-center mb-24 fade-in-up">
        <div class="eyebrow mb-8"></div>
        <h1 class="display-title">Quiz de<br><em>Sociologia</em></h1>
        <p style="margin-top:16px;font-size:0.75rem;color:rgba(255,255,255,0.38);max-width:360px;margin-inline:auto;line-height:1.7;">
          Recurso didático para uso em sala de aula. Selecione o tema e configure a partida.
        </p>
      </div>

      <div class="card fade-in-up" style="animation-delay:0.1s">

        <!-- Cabeçalho do card -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue-300)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span class="label">Selecione o tema</span>
        </div>

        <div id="temas-lista"></div>

        <div class="divider"></div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div id="tema-selecionado-label" style="font-size:0.72rem;color:rgba(255,255,255,0.28);display:flex;align-items:center;gap:6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Nenhum tema selecionado
          </div>
          <button id="btn-continuar" class="btn btn-primary" disabled onclick="continuar()">
            Continuar
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    clearState();
    const temasSelecionados = new Set();

    function renderTemas() {
      const container = document.getElementById('temas-lista');
      container.innerHTML = '';
      Object.entries(QUESTOES).forEach(([key, data]) => {
        const card = document.createElement('div');
        card.className = 'theme-card';
        card.dataset.key = key;
        card.innerHTML = `
          <div class="theme-card-row">
            <div class="theme-check" id="check-${key}">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div>
              <div class="theme-card-title">${data.titulo}</div>
              <div class="theme-card-meta">${data.questoes.length} questões &mdash; Autores Clássicos da Sociologia</div>
            </div>
          </div>`;
        card.addEventListener('click', () => toggleTema(key, card));
        container.appendChild(card);
      });
    }

    function toggleTema(key, card) {
      temasSelecionados.has(key) ? temasSelecionados.delete(key) : temasSelecionados.add(key);
      card.classList.toggle('selected', temasSelecionados.has(key));
      atualizarBotao();
    }

    function atualizarBotao() {
      const btn   = document.getElementById('btn-continuar');
      const label = document.getElementById('tema-selecionado-label');
      btn.disabled = temasSelecionados.size === 0;
      if (temasSelecionados.size > 0) {
        label.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--blue-300)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span style="color:rgba(147,191,244,0.85);">${QUESTOES[[...temasSelecionados][0]].titulo}</span>`;
      } else {
        label.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Nenhum tema selecionado`;
      }
    }

    function continuar() {
      if (temasSelecionados.size === 0) return;
      STATE.tema = [...temasSelecionados][0];
      goTo('configurar-jogo.html');
    }

    renderTemas();
  </script>
</body>
</html>
